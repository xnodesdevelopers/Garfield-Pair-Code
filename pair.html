<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GARFIELD-WHATSAPP-BOT-v10</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #141414;
      font-family: 'Arial', sans-serif;
      color: #00ffe7;
      text-align: center;
    }

    .container {
      background: rgba(0,0,255,0.8);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00ffe7;
      width: 320px;
    }

    h1 {
      margin-bottom: 15px;
      font-size: 24px;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 100%;
      margin-bottom: 10px;
      font-size: 16px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #25d366;
      color: white;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    button:hover {
      background: #1da851;
    }

    #loading-spinner {
      display: none;
      margin: 15px 0;
      color: #00ffe7;
    }

    #qr-container img {
      width: 300px;
      height: 300px;
      border-radius: 15px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GARFIELD BOT QR</h1>
    <input type="text" id="phone" placeholder="Your Phone Number" value="+94">
    <button id="generateBtn">Generate QR</button>

    <div id="loading-spinner">
      <i class="fas fa-spinner fa-spin fa-2x"></i>
      <p>Generating QR...</p>
    </div>

    <div id="qr-container"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    const generateBtn = document.getElementById('generateBtn');
    const spinner = document.getElementById('loading-spinner');
    const qrContainer = document.getElementById('qr-container');
    const phoneInput = document.getElementById('phone');

    generateBtn.addEventListener('click', async () => {
      qrContainer.innerHTML = '';
      spinner.style.display = 'block';

      try {
        const phone = phoneInput.value.replace(/[^0-9+]/g, '');
        const response = await axios.get(`/qr?number=${phone}`);
        
        if (response.data.qr) {
          qrContainer.innerHTML = `<img src="${response.data.qr}" alt="WhatsApp QR Code">`;
        } else {
          qrContainer.innerHTML = `<p>${response.data.message || 'QR generation failed'}</p>`;
        }

      } catch (err) {
        console.error(err);
        qrContainer.innerHTML = '<p>Error generating QR code</p>';
      } finally {
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
