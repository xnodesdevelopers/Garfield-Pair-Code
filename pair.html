<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garfield Bot – QR Link</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --bg:#0b0f1a;
  --card:#11162a;
  --primary:#4f8cff;
  --text:#e8ecff;
  --muted:#9aa3c7;
  --border:rgba(255,255,255,.08);
}

*{box-sizing:border-box}

body{
  min-height:100vh;
  background:radial-gradient(circle at top,#141b38,#070a14);
  font-family:Inter,system-ui;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  color:var(--text);
}

.container{
  width:100%;
  max-width:420px;
  background:var(--card);
  border-radius:18px;
  padding:26px;
  border:1px solid var(--border);
  box-shadow:0 20px 40px rgba(0,0,0,.45);
  text-align:center;
}

.logo{
  width:70px;height:70px;
  border-radius:50%;
  margin:0 auto 14px;
  background:linear-gradient(135deg,var(--primary),#7aa2ff);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;color:#fff;
}

h1{font-size:23px;margin-bottom:6px}
.subtitle{font-size:14px;color:var(--muted);margin-bottom:20px}

.input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1.5px solid var(--border);
  background:#0c1125;
  color:var(--text);
  font-size:15px;
  margin-bottom:16px;
}

.btn{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--primary);
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.qr-box{
  background:#0c1125;
  border-radius:16px;
  padding:22px;
  border:1px solid var(--border);
  margin-top:18px;
}

.qr-box img{
  max-width:260px;
  border-radius:12px;
}

.loading{
  font-size:22px;
  color:var(--primary);
  animation:spin 1s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

.error{color:#ff6b6b;font-size:14px}
</style>
</head>

<body>
<div class="container">

  <div class="logo"><i class="fas fa-qrcode"></i></div>
  <h1>Garfield Bot</h1>
  <p class="subtitle">Enter number → Scan QR</p>

  <!-- ✅ INPUT NUMBER -->
  <input id="number" class="input" placeholder="947xxxxxxxx" />

  <!-- ✅ QR BUTTON -->
  <button class="btn" onclick="generateQR()">Generate QR</button>

  <!-- QR AREA -->
  <div class="qr-box" id="qrBox">
    <i class="fas fa-spinner loading"></i>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>
<script>
async function generateQR(){
  const num=document.getElementById("number").value.replace(/[^0-9]/g,"");
  const box=document.getElementById("qrBox");

  if(!num){
    box.innerHTML='<div class="error">Enter WhatsApp number</div>';
    return;
  }

  box.innerHTML='<i class="fas fa-spinner loading"></i>';

  try{
    const res=await axios.get(`/qr?number=${num}`);
    if(!res.data || !res.data.qr){
      box.innerHTML='<div class="error">Failed to generate QR</div>';
      return;
    }
    box.innerHTML=`<img src="${res.data.qr}">`;
  }catch(e){
    box.innerHTML='<div class="error">QR error</div>';
  }
}
</script>
</body>
</html>
