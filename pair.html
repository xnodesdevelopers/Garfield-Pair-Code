<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GARFIELD-WHATSAPP-BOT QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>
<h3>Enter your WhatsApp number</h3>
<input id="number" placeholder="94xxxxxxxx">
<button id="submit">Get QR</button>
<br><br>
<img id="qrImage" width="250" />
<p id="message"></p>

<script>
const numberInput = document.getElementById("number");
const submitBtn = document.getElementById("submit");
const qrImage = document.getElementById("qrImage");
const message = document.getElementById("message");

submitBtn.onclick = async () => {
    const number = numberInput.value.replace(/[^0-9]/g,'');
    message.innerText = 'Generating QR...';
    qrImage.src = '';
    try {
        const { data } = await axios(`/qr?number=${number}`);
        if (data.qr) {
            qrImage.src = data.qr;
            message.innerText = data.message;
        } else {
            message.innerText = data.message || 'Failed to generate QR';
        }
    } catch(err) {
        message.innerText = 'Error contacting server';
        console.error(err);
    }
};
</script>
</body>
</html>
